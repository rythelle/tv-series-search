version: "3.3"

services:
  app:
    build: .
    ports:
      - "7777:7777"
    # Compose reads .env automatically when present. A fresh clone runs with
    # these defaults and needs only Docker with the Compose plugin.
    environment:
      APP_PORT: ${APP_PORT:-7777}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/tvseries}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-60}
      POPULAR_CACHE_TTL_SECONDS: ${POPULAR_CACHE_TTL_SECONDS:-300}
      SHOW_STALE_AFTER_SECONDS: ${SHOW_STALE_AFTER_SECONDS:-86400}
      TRIGRAM_WORD_SIMILARITY_THRESHOLD: ${TRIGRAM_WORD_SIMILARITY_THRESHOLD:-0.5}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-20}
      TVMAZE_TIMEOUT_SECONDS: ${TVMAZE_TIMEOUT_SECONDS:-5}
      TVMAZE_BREAKER_FAILURES: ${TVMAZE_BREAKER_FAILURES:-5}
      TVMAZE_BREAKER_COOLDOWN_SECONDS: ${TVMAZE_BREAKER_COOLDOWN_SECONDS:-30}
      COMMENT_MAX_LENGTH: ${COMMENT_MAX_LENGTH:-1000}
      COMMENTS_PAGE_SIZE: ${COMMENTS_PAGE_SIZE:-50}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.1-flash-lite}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_BREAKER_FAILURES: ${AI_BREAKER_FAILURES:-3}
      AI_BREAKER_COOLDOWN_SECONDS: ${AI_BREAKER_COOLDOWN_SECONDS:-60}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
      AI_PROMPT_COMMENT_COUNT: ${AI_PROMPT_COMMENT_COUNT:-10}
      AI_PROMPT_MAX_CHARS: ${AI_PROMPT_MAX_CHARS:-4000}
      INSIGHT_CACHE_TTL_SECONDS: ${INSIGHT_CACHE_TTL_SECONDS:-86400}
      INSIGHT_FALLBACK_TTL_SECONDS: ${INSIGHT_FALLBACK_TTL_SECONDS:-300}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      INSIGHT_RATE_LIMIT_PER_MINUTE: ${INSIGHT_RATE_LIMIT_PER_MINUTE:-10}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_PAGES: ${SEED_PAGES:-3}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tvseries
    # Probed over TCP on purpose. While `initdb` runs, the image's entrypoint
    # starts a temporary server with listen_addresses='' — reachable only over
    # the Unix socket — and `pg_isready` there answers "accepting connections"
    # before POSTGRES_DB exists and before that server is shut down and
    # replaced. A TCP probe stays red until the real server is listening.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d tvseries"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
